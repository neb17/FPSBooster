
name: Build FPSBooster

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q FPSBooster-project.zip -d .
          ls -la FPSBooster-project

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Java mod
        working-directory: FPSBooster-project/java
        run: gradle build

      - name: Prepare Bedrock add-on
        run: |
          mkdir -p output
          cd FPSBooster-project/bedrock
          zip -r ../../output/FPSBooster.mcpack .

          cd ../../output
          zip FPSBooster.mcaddon FPSBooster.mcpack

      - name: Collect Java JAR
        run: |
          mkdir -p output
          cp FPSBooster-project/java/build/libs/*.jar output/

      - name: Upload finished files
        uses: actions/upload-artifact@v4
        with:
          name: FPSBooster-downloads
          path: output/
